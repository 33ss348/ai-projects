<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A simple calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        #container {
            width: 100px;
            height: 550px;
        }
        #calculator {
            width: 320px;
            height: 520px;
            background-color: #fff;
            margin: 0 auto;
            top: 20px;
            position: relative;
            border-radius: 5px;
            box-shadow: 4px 8px 0px rgba(0, 0, 0, 0.2), 6px 20px 0px rgba(0, 0, 0, 0.19);
        }
        #result {
            height: 120px;
        }
        #keyboard {
            height: 400px;
        }
        .operator, .number  {
            width: 50px;
            height: 50px;
            margin: 15px;
            float: left;
            border-radius: 50%;
            border-width: 0;
            font-weight: bold;
            font-size: 15px;
        }
        .number {
            background-color: #e0e0e0;
        }
        .number .operator {
           cursor: pointer;
        }
        .operator.active .number.active{
            font-size: 13px;
        }
        .operator:focus, .number:focus {
            outline: 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="calculator">
            <div id="result">
                <div id="history">
                    <div id="history-value">
                    </div>
                    <div id="output">
                    <div id="output-value">
                        </div>
                    </div>
                    <div id="keyboard">
                        <button class="operator" id="clear">C</button>
                        <button class="operator" id="backspace">←</button>
                        <button class="operator" id="divide">÷</button>
                        <button class="number" id="7">7</button>
                        <button class="number" id="8">8</button>
                        <button class="number" id="9">9</button>
                        <button class="operator" id="multiply">×</button>
                        <button class="number" id="4">4</button>
                        <button class="number" id="5">5</button>
                        <button class="number" id="6">6</button>
                        <button class="operator" id="subtract">-</button>
                        <button class="number" id="1">1</button>
                        <button class="number" id="2">2</button>
                        <button class="number" id="3">3</button>
                        <button class="operator" id="add">+</button>
                        <button class="number" id="0">0</button>
                        <button class="number" id="decimal">.</button>
                        <button class="operator" id="equals">=</button>
                        <button class="operator" id="percent">%</button>
                    </div>
                </div>
                <script src="script.js"></script>
            </div>
        </div>
    </div>
</body>
</html>
